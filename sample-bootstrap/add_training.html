<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Training | Employee Info System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/add_training.css">
</head>
<body>

<div class="fire-bg"></div>

<div class="container py-5">

    <div class="glass-card p-4 mx-auto" style="max-width:500px;">
        <h3 class="fire-title text-center mb-4">Add Training</h3>

        <div class="mb-3">
            <label class="form-label">Training Title</label>
            <input type="text" id="trainingTitle" class="form-control fire-input" placeholder="Enter title">
        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" id="trainingDate" class="form-control fire-input">
        </div>

        <button id="saveBtn" class="btn fire-btn w-100">Add Training</button>
    </div>
</div>

<script>
// Get trainings from LocalStorage
let trainings = JSON.parse(localStorage.getItem("trainings")) || [];

const titleInput = document.getElementById("trainingTitle");
const dateInput = document.getElementById("trainingDate");
const saveBtn = document.getElementById("saveBtn");

saveBtn.addEventListener("click", ()=>{
    const title = titleInput.value.trim();
    const date = dateInput.value;

    if(!title || !date){
        alert("Please fill all fields");
        return;
    }

    let id = trainings.length ? trainings[trainings.length-1].id + 1 : 1;
    trainings.push({id, title, date});

    localStorage.setItem("trainings", JSON.stringify(trainings));

    alert("Training added successfully!");
    window.location.href = "training.html";
});
</script>

</body>
</html>
