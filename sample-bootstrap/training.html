<!-- Trainings Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Trainings | Employee Info System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Firey Theme CSS -->
    <link rel="stylesheet" href="./css/training.css">
</head>

<body>

    <div class="fire-bg"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent glass-card p-3">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#">Employee Info System</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="trainings.html">Trainings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="text-white">Trainings</h2>
            <!-- Redirect to add_training.html -->
            <a href="add_training.html" class="btn fire-btn" id="addTrainingBtn">Add Training</a>
        </div>

        <!-- Search -->
        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control fire-input" id="searchTraining" placeholder="Search training..."
                    onkeyup="searchTrainings()">
            </div>
        </div>

        <!-- Trainings Table -->
        <div class="table-responsive glass-card p-3">
            <table class="table table-hover mb-0">
                <thead class="table-header">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Date</th>
                        <th width="150">Actions</th>
                    </tr>
                </thead>
                <tbody id="trainingTable">
                    <!-- JS populates rows -->
                </tbody>
            </table>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // LocalStorage
        let trainings = JSON.parse(localStorage.getItem("trainings")) || [];

        // Render trainings table
        function displayTrainings() {
            const table = document.getElementById("trainingTable");
            table.innerHTML = "";
            trainings.forEach((t, i) => {
                table.innerHTML += `
        <tr>
            <td>${t.id}</td>
            <td>${t.title}</td>
            <td>${t.date}</td>
            <td class="text-center">
                <button class="btn btn-sm fire-btn-outline" onclick="viewTraining(${i})">View</button>
                <button class="btn btn-sm fire-btn-warning" onclick="editTraining(${i})">Edit</button>
                <button class="btn btn-sm fire-btn-danger" onclick="deleteTraining(${i})">Delete</button>
            </td>
        </tr>
        `;
            });
        }

        // Actions
        function viewTraining(i) { alert("View: " + trainings[i].title); }
        function editTraining(i) {
            localStorage.setItem("editTraining", i);
            window.location.href = "edit_training.html";
        }
        function deleteTraining(i) {
            if (confirm("Delete training?")) {
                trainings.splice(i, 1);
                localStorage.setItem("trainings", JSON.stringify(trainings));
                displayTrainings();
            }
        }

        // Search function
        function searchTrainings() {
            const input = document.getElementById("searchTraining").value.toLowerCase();
            document.querySelectorAll("#trainingTable tr").forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
            });
        }

        displayTrainings();
    </script>

</body>

</html>
