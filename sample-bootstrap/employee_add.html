<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Employee | Employee Info System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/employee_form.css">
</head>
<body>

<div class="fire-bg"></div>

<div class="container py-5">

    <div class="glass-card p-4 mx-auto" style="max-width:500px;">

        <h3 class="fire-title text-center mb-4">Add Employee</h3>

        <div class="mb-3">
            <label class="form-label">Employee ID</label>
            <input type="text" id="empid" class="form-control fire-input" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" id="first" class="form-control fire-input">
        </div>

        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" id="last" class="form-control fire-input">
        </div>

        <div class="mb-3">
            <label class="form-label">Birthday</label>
            <input type="date" id="birthday" class="form-control fire-input">
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select id="status" class="form-select fire-input">
                <option value="Active">Active</option>
                <option value="Permanent">Permanent</option>
                <option value="Temporary">Temporary</option>
                <option value="Separated">Separated</option>
            </select>
        </div>

        <button id="addBtn" class="btn fire-btn w-100">
            Add Employee
        </button>

    </div>
</div>

<script>
// Get stored employees and activities
let employees = JSON.parse(localStorage.getItem("employees")) || [];
let activities = JSON.parse(localStorage.getItem("activities")) || [];

// Generate unique Employee ID
let newID = employees.length ? Math.max(...employees.map(e => e.id)) + 1 : 1;
document.getElementById("empid").value = newID;

// Form inputs
const firstInput = document.getElementById("first");
const lastInput = document.getElementById("last");
const birthdayInput = document.getElementById("birthday");
const statusInput = document.getElementById("status");
const addBtn = document.getElementById("addBtn");

addBtn.addEventListener("click", ()=> {
    const first = firstInput.value.trim();
    const last = lastInput.value.trim();
    const birthday = birthdayInput.value;
    const status = statusInput.value;

    if(!first || !last || !birthday){
        alert("Please fill all fields");
        return;
    }

    const empName = first + " " + last;

    // Add employee to array
    employees.push({
        id: newID,
        first: first,
        last: last,
        birthday: birthday,
        status: status
    });

    // Add to activity log
    activities.push({
        action: "Added Employee",
        employee: empName,
        date: new Date().toLocaleString()
    });

    // Save to localStorage
    localStorage.setItem("employees", JSON.stringify(employees));
    localStorage.setItem("activities", JSON.stringify(activities));

    // Redirect to employee list
    window.location.href = "employee_list.html";
});
</script>

</body>
</html>
