<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fire Login</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="fire-bg"></div>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="login-card">

        <h2 class="text-center fire-title">EMPLOYEE INFORMATION SYSTEM</h2>
        <p class="text-center subtitle">Welcome back</p>

        <div class="mb-3">
            <input type="text" id="username" class="form-control fire-input" placeholder="Username">
        </div>

        <div class="mb-3 position-relative">
            <input type="password" id="password" class="form-control fire-input" placeholder="Password">
            <span class="toggle-pass" onclick="togglePassword()">👁</span>
        </div>

        <button onclick="login()" class="btn fire-btn w-100">
            Login
        </button>

        <p class="error text-center mt-3" id="errorMsg"></p>

    </div>

</div>

<script>
function togglePassword(){
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

async function login(){
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.textContent = "";

    if(!username || !password){
        errorMsg.textContent="Enter username and password";
        return;
    }

    try{
        const response = await fetch("http://localhost/api/login.php",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({username,password})
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.message || "Invalid login");
        }

        sessionStorage.setItem("auth","true");

        // Redirect to dashboard after login
        window.location.href="dashboard.html";

    }catch(err){
        errorMsg.textContent=err.message;
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
